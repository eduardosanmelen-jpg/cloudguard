[project]
name = "cloudguard"
version = "1.0.0"
description = "Lightweight AWS security posture scanner mapped to the CIS AWS Foundations Benchmark"
requires-python = ">=3.9"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
demo = ["moto[s3,ec2,iam,cloudtrail,rds,sts]>=5.0"]

[project.scripts]
cloudguard = "cloudguard.cli:main"

[tool.setuptools]
packages = ["cloudguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"cloudguard/report.py" = ["E501"]  # inline HTML/CSS template
